# Compatibility configuration when launched from streamlit_app/.
# Canonical options live at the repository root: .streamlit/config.toml.
[theme]
base = "light"
primaryColor = "#009344"
backgroundColor = "#FCFDFC"
secondaryBackgroundColor = "#F0F6F1"
textColor = "#064937"
font = "sans serif"
linkColor = "#006F34"
borderColor = "#D9E6DE"
dataframeHeaderBackgroundColor = "#F0F6F1"
# Informasi dan status sukses mengikuti tema; peringatan/error tetap semantik.
blueColor = "#006F34"
blueBackgroundColor = "#F0F6F1"
blueTextColor = "#064937"
greenColor = "#009344"
greenBackgroundColor = "#F0F6F1"
greenTextColor = "#006F34"

[theme.sidebar]
backgroundColor = "#F0F6F1"
secondaryBackgroundColor = "#FCFDFC"
textColor = "#064937"

[browser]
gatherUsageStats = false

[client]
# Ekspor tabel bawaan melewati serializer aman; gunakan tombol Unduh CSV aplikasi.
disableDataExport = true
