name: Real browser acceptance

on:
  push:
    branches: [main, migration/reference-code-and-artifacts]
  pull_request:
    paths:
      - 'streamlit_app/**'
      - '.streamlit/**'
      - 'requirements*.txt'
      - 'tests/test_ui_file_safety.py'
      - 'scripts/browser_acceptance.py'
      - '.github/workflows/browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        startup: [root, root-export-override, external-cwd]
    env:
      STARTUP_CASE: ${{ matrix.startup }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install app, browser runner, and tests
        run: |
          python -m pip install -e . -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Launch real Streamlit server
        run: |
          log_dir="$GITHUB_WORKSPACE/results/browser-acceptance"
          app_path="$GITHUB_WORKSPACE/streamlit_app/app.py"
          mkdir -p "$log_dir"
          extra_options=()
          if [ "$STARTUP_CASE" = "root-export-override" ]; then
            extra_options+=(--client.disableDataExport=false)
          elif [ "$STARTUP_CASE" = "external-cwd" ]; then
            cd "$RUNNER_TEMP"
            python -c 'import streamlit as st; assert st.get_option("client.disableDataExport") is False'
          fi
          nohup python -m streamlit run "$app_path" "${extra_options[@]}" \
            --server.headless=true \
            --server.port=8501 \
            --server.address=127.0.0.1 \
            --browser.gatherUsageStats=false \
            > "$log_dir/streamlit-server.log" 2>&1 &
          echo $! > "$log_dir/streamlit.pid"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo "Streamlit HTTP health endpoint ready"
              exit 0
            fi
            sleep 2
          done
          cat "$log_dir/streamlit-server.log"
          exit 1
      - name: Test user journeys in Chromium
        run: python scripts/browser_acceptance.py
      - name: Upload browser screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-browser-acceptance-${{ matrix.startup }}
          path: results/browser-acceptance/
          if-no-files-found: warn
          retention-days: 14
