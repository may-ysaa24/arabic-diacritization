name: Restore research checkpoints

on:
  push:
    branches: [migration/reference-code-and-artifacts]
    paths:
      - "models/baseline/_chunks/**"
      - "models/pretrained/_chunks/**"
      - ".github/workflows/restore-research-models.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore checkpoints and verify exact Git blob hashes
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          expected = {
              "baseline": ("best_model.pt", 3320757, "a3c1421cf413e7ce53767b62278c5430a954fabd"),
              "pretrained": ("best_pretrained_model.pt", 3321810, "60f3a9fa32648d3daa54eb99b2580458fcdf3aed"),
          }
          for name, (filename, length, expected_sha) in expected.items():
              folder = Path("models") / name
              pieces = sorted((folder / "_chunks").glob("*.b64"))
              assert [p.name for p in pieces] == [f"{i:03}.b64" for i in range(28)]
              encoded = "".join(p.read_text(encoding="utf-8") for p in pieces)
              content = base64.b64decode(encoded, validate=True)
              assert len(content) == length, (name, len(content))
              git_sha = hashlib.sha1(f"blob {len(content)}".encode() + bytes([0]) + content).hexdigest()
              assert git_sha == expected_sha, (name, git_sha, expected_sha)
              (folder / filename).write_bytes(content)
              print(f"{name} verified: bytes={length} git_sha={git_sha} sha256={hashlib.sha256(content).hexdigest()}")
          PY
      - name: Commit verified models and remove temporary parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r models/baseline/_chunks models/pretrained/_chunks
          git add models/baseline/best_model.pt models/pretrained/best_pretrained_model.pt
          git commit -m "build: restore verified baseline and pretrained checkpoints"
          git push origin HEAD:migration/reference-code-and-artifacts
